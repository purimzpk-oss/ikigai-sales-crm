<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --line:#dde3e0; --fg:#18231f; --muted:#5f6d68;
  --accent:#1f6f5c; --accent-soft:#e2f0eb; --warm:#c7791f; --warm-soft:#fbefdf;
  --good:#2f8a4e; --bad:#b4423a; --info:#2d64a8; --violet:#7a67c4; --pink:#c4508a;
  --font:"IBM Plex Sans Thai",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211e; --line:#2a3632; --fg:#e6eeea; --muted:#9aaaa4;
  --accent:#4fb89b; --accent-soft:#1d3a32; --warm:#e3a04f; --warm-soft:#3a2c1a;
  --good:#5cc27e; --bad:#e2766d; --info:#74a6e6; --violet:#a594e6; --pink:#e07fb0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211e; --line:#2a3632; --fg:#e6eeea; --muted:#9aaaa4;
  --accent:#4fb89b; --accent-soft:#1d3a32; --warm:#e3a04f; --warm-soft:#3a2c1a;
  --good:#5cc27e; --bad:#e2766d; --info:#74a6e6; --violet:#a594e6; --pink:#e07fb0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:17px;padding:0 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:7px;border:2px solid var(--surface);border-radius:50%}
nav.rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--bg);color:var(--fg)}
nav.rail a.on{background:var(--accent-soft);color:var(--accent)}
nav.rail a .n{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--warm-soft);color:var(--warm);padding:1px 7px;border-radius:20px}
.me{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.me b{color:var(--fg);font-weight:600}
main{padding-block:24px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
header.top h1{font-size:22px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.sp{flex:1}
.btn{color:var(--fg);border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:14px;margin:0 0 12px;font-weight:600}
.stack{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;margin-top:2px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.bar-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.bar-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
svg text{fill:var(--muted);font-family:var(--font);font-size:11px}
.funnel .row{display:grid;grid-template-columns:100px 1fr 80px;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
.funnel .track{height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
.funnel .fill{height:100%;border-radius:4px}
.funnel .amt{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:20px;white-space:nowrap;font-weight:500;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.who{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;color:#fff;background:var(--c);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.filters input{flex:1;min-width:180px}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:color-mix(in srgb,var(--line) 35%,var(--bg));border-radius:var(--r);padding:10px;min-height:300px}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-size:13px;margin:0 0 4px;display:flex;align-items:center;gap:6px}
.col h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.col .sum{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;font-size:13px}
.card .m{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);gap:6px}
.card .val{font-family:var(--mono);color:var(--fg)}
.card .due{font-size:11px;color:var(--warm);margin-top:4px}
.mapwrap{display:grid;grid-template-columns:1fr 300px;gap:16px}
#leaf{height:min(70vh,600px);border-radius:var(--r);border:1px solid var(--line);z-index:0}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{font-weight:500}
.task .tm{font-size:12px;color:var(--muted)}
.task .when{margin-left:auto;font-size:12px;white-space:nowrap}
.late{color:var(--bad);font-weight:600}
.today{color:var(--warm);font-weight:600}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:1001;overflow-y:auto;padding:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.drawer h2{margin:0;font-size:20px;overflow-wrap:anywhere}
.drawer h3{font-size:14px;margin:20px 0 8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:16px 0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.timeline .ev{position:relative;margin-bottom:14px;font-size:13px;white-space:pre-wrap}
.timeline .ev::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .ev small{color:var(--muted);display:block}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.form input,.form select,.form textarea,select.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:2000;font-size:13px;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.copy{border:0;background:none;color:var(--accent);cursor:pointer;padding:0 4px;font-size:12px}
.link{color:var(--accent)}
.empty{color:var(--muted);padding:12px 0}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login .panel{width:min(380px,100%);padding:28px}
.login h1{font-size:22px;margin:0 0 4px;display:flex;gap:10px;align-items:center}
.login .brand{padding:0}
.chk{display:flex!important;grid-template-columns:none;align-items:flex-start;gap:8px!important;color:var(--fg)!important;font-size:13px!important}
.chk input{width:auto;margin-top:3px}
.err-msg{color:var(--bad);font-size:13px}
.loading{display:grid;place-items:center;min-height:100%;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:9px;padding:4px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs.big{background:var(--surface);border:1px solid var(--line)}
.tabs.big button.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.tabs .n{font-family:var(--mono);font-size:11px;background:var(--warm-soft);color:var(--warm);padding:1px 7px;border-radius:20px}
.demo-box{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:6px;text-align:center}
.demo-bar{background:var(--warm-soft);color:var(--warm);font-size:13px;padding:6px 16px;text-align:center}
.brand img{flex:none}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.qrow:hover{border-color:var(--accent)}
.drawer.wide{width:min(640px,100%)}
.qitems{display:grid;gap:6px}
.qitem{display:grid;grid-template-columns:1fr 64px 64px 96px 90px 24px;gap:6px;align-items:center}
.qitem input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.qsum{display:grid;gap:4px;margin-left:auto;width:min(280px,100%);font-size:13px}
.qsum div{display:flex;justify-content:space-between}
.qsum b{font-family:var(--mono);font-weight:500}
.qsum .tot{border-top:1px solid var(--line);padding-top:6px;font-size:15px}
.qsum .tot b{font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.thumb{position:relative}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:11px}
.timeline .ev.visit::before{background:var(--accent)}
.tform{grid-template-columns:1fr auto auto;align-items:end;margin-top:8px}
.pform{grid-template-columns:2fr 1fr 80px 110px auto}
.pform input,td .inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);background:var(--c);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--fg)}
.swatches input[type=color]{width:40px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.card .mv{display:none;margin-top:8px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-size:12px}
@media (hover:none),(max-width:720px){.card .mv{display:block}}
@media (max-width:720px){
  .qitem{grid-template-columns:1fr 56px 56px 80px 22px}
  .qitem .num{display:none}
  .pform{grid-template-columns:1fr 1fr}
  .tform{grid-template-columns:1fr 1fr}
  .tform button{grid-column:1/-1}
}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.mapwrap{grid-template-columns:1fr}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  nav.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:900}
  nav.rail .brand,nav.rail .me{display:none}
  nav.rail a{flex-direction:column;gap:0;font-size:11px;padding:6px 4px}
  nav.rail a .n{display:none}
  main{padding-bottom:96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hide-sm{display:none}
  .kpi .v{font-size:19px}
  .row2{grid-template-columns:1fr}
  .kv{grid-template-columns:90px 1fr}
  .funnel .row{grid-template-columns:84px 1fr 72px}
  .board{grid-template-columns:repeat(5,78vw);scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start;min-height:200px}
}
@media (prefers-reduced-motion:no-preference){.card,.btn,nav.rail a{transition:border-color .15s,background .15s}}
</style>

function makeDemo() {
  let db; try { db = JSON.parse(localStorage.getItem(DEMO_DB) || "null"); } catch {}
  if (!db) db = demoSeed();
  const save = () => { try { localStorage.setItem(DEMO_DB, JSON.stringify(db)); } catch {} };
  save();
  const now = () => new Date().toISOString();
  const meRow = () => db.profiles.find(p => p.id === db.me);
  const lead = () => meRow()?.role === "lead";
  const canCust = cid => lead() || db.customers.find(c => c.id === cid)?.owner_id === db.me;
  const visible = (t, r) => {
    if (t === "customers") return lead() || r.owner_id === db.me;
    if (["tasks", "activities", "quotes"].includes(t)) return canCust(r.customer_id);
    if (t === "perm_log") return lead();
    return true;
  };
  const defaults = (t, r) => {
    const base = { created_at: now(), ...r };
    if (t !== "targets" && t !== "org" && base.id == null) base.id = Math.max(0, ...db[t].map(x => +x.id || 0)) + 1;
    if (t === "customers") Object.assign(base, { updated_at: now() }, r.stage === "won" && !r.closed_at ? { closed_at: now().slice(0, 10) } : {});
    if (t === "activities") { base.author_id ??= db.me; base.photos ??= []; base.kind ??= "note"; }
    if (t === "tasks") { base.assignee_id ??= db.me; base.done ??= false; }
    if (t === "quotes") base.created_by ??= db.me;
    return base;
  };
  class Q {
    constructor(t) { this.t = t; this.op = "select"; this.f = []; this.ord = []; this.lim = null; this.one = false; this.p = null; }
    select() { return this; }
    insert(p) { this.op = "insert"; this.p = p; return this; }
    update(p) { this.op = "update"; this.p = p; return this; }
    upsert(p) { this.op = "upsert"; this.p = p; return this; }
    delete() { this.op = "delete"; return this; }
    eq(k, v) { this.f.push(r => String(r[k]) === String(v)); return this; }
    in(k, vs) { this.f.push(r => vs.map(String).includes(String(r[k]))); return this; }
    order(k, o) { this.ord.push([k, o?.ascending !== false]); return this; }
    limit(n) { this.lim = n; return this; }
    single() { this.one = true; return this; }
    maybeSingle() { this.one = true; return this; }
    then(ok, bad) { return new Promise(r => setTimeout(r, 60)).then(() => this.run()).then(ok, bad); }
    run() {
      const t = this.t; db[t] ||= [];
      const match = r => visible(t, r) && this.f.every(f => f(r));
      const err = m => ({ data: null, error: { message: m } });
      let out;
      if (this.op === "select") {
        out = db[t].filter(match);
        for (const [k, asc] of [...this.ord].reverse()) out.sort((a, b) => (String(a[k] ?? "") > String(b[k] ?? "") ? 1 : String(a[k] ?? "") < String(b[k] ?? "") ? -1 : 0) * (asc ? 1 : -1));
        if (this.lim) out = out.slice(0, this.lim);
      } else if (this.op === "insert" || this.op === "upsert") {
        const rows = (Array.isArray(this.p) ? this.p : [this.p]);
        if (["tasks", "activities", "quotes"].includes(t) && rows.some(r => !canCust(r.customer_id))) return err("ไม่มีสิทธิ์");
        if (["products", "targets", "org"].includes(t) && !lead()) return err("เฉพาะหัวหน้าทีม");
        out = rows.map(r => {
          const key = t === "targets" ? "month" : "id";
          const ex = this.op === "upsert" && db[t].find(x => String(x[key]) === String(r[key]));
          if (ex) { Object.assign(ex, r); return ex; }
          const row = defaults(t, r); db[t].push(row); return row;
        });
      } else if (this.op === "update") {
        out = db[t].filter(match);
        if (t === "profiles" && ("role" in this.p || "status" in this.p)) {
          if (!lead()) return err("เฉพาะหัวหน้าทีมที่เปลี่ยนสิทธิ์ได้");
          for (const r of out) { if (r.id === db.me) return err("เปลี่ยนสิทธิ์ของตัวเองไม่ได้"); const ch = []; if (this.p.role && this.p.role !== r.role) ch.push(`บทบาท ${r.role} → ${this.p.role}`); if (this.p.status && this.p.status !== r.status) ch.push(`สถานะ ${r.status} → ${this.p.status}`); if (ch.length) db.perm_log.push({ id: db.perm_log.length + 1, actor_id: db.me, target_id: r.id, change: ch.join(", "), created_at: now() }); }
        }
        out.forEach(r => { const wasWon = r.stage === "won"; Object.assign(r, this.p); if (t === "customers") { r.updated_at = now(); if (r.stage === "won" && !wasWon) r.closed_at ||= now().slice(0, 10); if (r.stage !== "won") r.closed_at = null; } });
      } else if (this.op === "delete") {
        if (t === "customers" && !lead()) return err("เฉพาะหัวหน้าทีม");
        out = db[t].filter(match); db[t] = db[t].filter(r => !out.includes(r));
        if (t === "customers") for (const k of ["tasks", "activities", "quotes"]) db[k] = db[k].filter(r => !out.some(c => c.id === r.customer_id));
      }
      if (this.op !== "select") save();
      out = JSON.parse(JSON.stringify(out));
      return { data: this.one ? out[0] ?? null : out, error: this.one && !out.length && this.op === "select" ? null : null };
    }
  }
  const listeners = [];
  const session = () => ({ user: { id: db.me, email: "demo@example.com" } });
  const fileToURL = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
  return {
    from: t => new Q(t),
    demoDB: () => db,
    demoSwitch: id => { db.me = id; save(); location.reload(); },
    demoReset: () => { try { localStorage.removeItem(DEMO_DB); } catch {} location.reload(); },
    auth: {
      onAuthStateChange(cb) { listeners.push(cb); setTimeout(() => cb("INITIAL_SESSION", session()), 0); return { data: { subscription: { unsubscribe() {} } } }; },
      signOut: async () => { exitDemo(); return { error: null }; },
      signInWithPassword: async () => ({ error: { message: "โหมดทดลองใช้ไม่ต้องล็อกอิน" } }),
      signUp: async () => ({ error: { message: "โหมดทดลองใช้สมัครสมาชิกไม่ได้" } }),
      resetPasswordForEmail: async () => ({ error: null }),
      updateUser: async () => ({ error: { message: "โหมดทดลองใช้เปลี่ยนรหัสผ่านไม่ได้" } }),
    },
    storage: { from: () => ({
      upload: async (path, file) => { db.files[path] = await fileToURL(file); save(); return { data: { path }, error: null }; },
      createSignedUrls: async paths => ({ data: paths.map(p => ({ path: p, signedUrl: db.files[p] || "" })), error: null }),
      getPublicUrl: path => ({ data: { publicUrl: db.files[path] || "" } }),
    }) },
  };
}

/* ===== dashboard ===== */
function dashboard() {
  const today = todayISO(), ym = today.slice(0, 7);
  const cs = S.customers;
  const wonMonth = cs.filter(c => c.stage === "won" && (c.closed_at || "").startsWith(ym));
  const wonV = wonMonth.reduce((a, c) => a + Number(c.deal_value), 0);
  const open = cs.filter(c => OPEN.includes(c.stage));
  const pipeV = open.reduce((a, c) => a + Number(c.deal_value), 0);
  const fc = open.reduce((a, c) => a + Number(c.deal_value) * st(c.stage).p, 0);
  const wonAll = cs.filter(c => c.stage === "won").length, closed = cs.filter(c => ["won", "lost"].includes(c.stage)).length;
  const target = Number(S.targets.find(t => t.month.startsWith(ym))?.amount || 0);

  // last 6 months
  const months = [];
  const [y, m] = ym.split("-").map(Number);
  for (let i = 5; i >= 0; i--) { const d = new Date(Date.UTC(y, m - 1 - i, 1)); const key = d.toISOString().slice(0, 7); months.push({ key, label: MONTHS[d.getUTCMonth()], v: cs.filter(c => c.stage === "won" && (c.closed_at || "").startsWith(key)).reduce((a, c) => a + Number(c.deal_value), 0), t: Number(S.targets.find(t => t.month.startsWith(key))?.amount || 0) }); }
  const top = Math.max(1000, ...months.map(x => Math.max(x.v, x.t)));
  const step = (() => { const raw = top / 3, mag = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= raw); })();
  const ticks = Math.ceil(top / step), max = step * ticks;
  const W = 560, H = 200, pad = 44, bw = (W - pad) / 6;
  const fmtK = v => v >= 1e6 ? +(v / 1e6).toFixed(2) + "M" : v >= 1000 ? +(v / 1000).toFixed(1) + "k" : String(v);
  let grid = "", bars = "";
  for (let i = 0; i <= ticks; i++) { const v = step * i, yy = H - 20 - (v / max) * (H - 40); grid += `<line x1="${pad}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pad - 6}" y="${yy + 4}" text-anchor="end">${fmtK(v)}</text>`; }
  months.forEach((mo, i) => {
    const x = pad + i * bw + bw * .2, w = bw * .6, h = (mo.v / max) * (H - 40), yy = H - 20 - h;
    bars += `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(h, 0)}" rx="3" fill="${i === 5 ? "var(--warm)" : "var(--accent)"}"><title>${mo.label}: ${baht(mo.v)}</title></rect>`;
    if (mo.t) { const ty = H - 20 - (mo.t / max) * (H - 40); bars += `<line x1="${x - 4}" x2="${x + w + 4}" y1="${ty}" y2="${ty}" stroke="var(--fg)" stroke-width="2" stroke-dasharray="4 3"><title>เป้า ${baht(mo.t)}</title></line>`; }
    bars += `<text x="${x + w / 2}" y="${H - 4}" text-anchor="middle">${mo.label}</text>`;
  });
  const funnel = STAGES.filter(s => s.k !== "lost").map(s => { const l = cs.filter(c => c.stage === s.k); return { s, n: l.length, v: l.reduce((a, c) => a + Number(c.deal_value), 0) }; });
  const fmax = Math.max(1, ...funnel.map(f => f.v));
  const dueTasks = S.tasks.filter(t => !t.done && t.due_date <= today);
  const repRows = S.team.map(p => { const mine = cs.filter(c => c.owner_id === p.id); const o = mine.filter(c => OPEN.includes(c.stage)); const w = mine.filter(c => c.stage === "won" && (c.closed_at || "").startsWith(ym)).reduce((a, c) => a + Number(c.deal_value), 0); return `<tr><td>${rep(p.id)}</td><td class="num">${o.length}</td><td class="num">${baht(o.reduce((a, c) => a + Number(c.deal_value), 0))}</td><td class="num">${baht(w)}</td></tr>`; }).join("");
  const monthName = new Date().toLocaleDateString("th-TH", { month: "long", year: "numeric", timeZone: "Asia/Bangkok" });

  $("#main").innerHTML = `
  <header class="top"><div><h1>ภาพรวมยอดขาย</h1><div class="sub">${monthName}${isLead() ? " · ทั้งทีม" : " · เฉพาะลูกค้าของคุณ"}</div></div><div class="sp"></div><button class="btn pri" onclick="openForm()">+ เพิ่มลูกค้า</button></header>
  ${cs.length ? "" : `<div class="panel" style="margin-bottom:16px;background:var(--accent-soft);border-color:transparent">ยังไม่มีลูกค้าในระบบ กด "+ เพิ่มลูกค้า" ${isLead() ? 'หรือไปที่ <a class="link" href="#settings">ตั้งค่า</a> เพื่อนำเข้าจาก Google Sheet' : ""}</div>`}
  <div class="kpis">
    <div class="panel kpi"><div class="l">ยอดปิดได้เดือนนี้</div><div class="v">${baht(wonV)}</div><div class="d">${target ? `เป้า ${baht(target)} · ${Math.round(wonV / target * 100)}%` : isLead() ? '<a class="link" href="#settings">ตั้งเป้าเดือนนี้</a>' : "ยังไม่ได้ตั้งเป้า"}</div></div>
    <div class="panel kpi"><div class="l">มูลค่าดีลที่กำลังเปิด</div><div class="v">${baht(pipeV)}</div><div class="d">${open.length} ดีล</div></div>
    <div class="panel kpi"><div class="l">คาดการณ์ (ถ่วงตามโอกาสปิด)</div><div class="v">${baht(fc)}</div><div class="d">จากดีลที่เปิดอยู่</div></div>
    <div class="panel kpi"><div class="l">อัตราปิดการขาย</div><div class="v">${closed ? Math.round(wonAll / closed * 100) + "%" : "-"}</div><div class="d">${wonAll} จาก ${closed} ดีลที่จบแล้ว</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>ยอดขายรายเดือน</h2>
      <div class="bar-legend"><span style="--c:var(--accent)">ยอดปิดได้</span><span style="--c:var(--warm)">เดือนนี้</span><span style="--c:var(--fg)">เป้า (เส้นประ)</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟยอดขายรายเดือน">${grid}${bars}</svg></div>
    <div class="panel funnel"><h2>ดีลในแต่ละขั้น</h2>
      ${funnel.map(f => `<div class="row"><span>${f.s.n} <span class="sub">(${f.n})</span></span><div class="track"><div class="fill" style="width:${f.v / fmax * 100}%;background:${f.s.c}"></div></div><span class="amt">${baht(f.v)}</span></div>`).join("")}
    </div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>ต้องติดตามวันนี้และที่เลยกำหนด</h2>
      ${dueTasks.map(t => { const c = cust(t.customer_id); return c ? `<div class="task"><div style="min-width:0"><div class="tt">${esc(t.title)}</div><div class="tm"><a class="link" href="javascript:openDetail(${c.id})">${esc(c.name)}</a>${c.phone ? " · " + esc(c.phone) : ""}</div></div><div class="when">${due(t.due_date)}</div></div>` : ""; }).join("") || "<p class='empty'>ไม่มีงานค้าง</p>"}
    </div>
    <div class="panel"><h2>ผลงานรายคน (เดือนนี้)</h2><div class="tbl-wrap"><table><thead><tr><th>เซลล์</th><th class="num">ดีลเปิด</th><th class="num">มูลค่า</th><th class="num">ปิดได้</th></tr></thead><tbody>${repRows}</tbody></table></div></div>
  </div>`;
}

async function setStage(id, stage) {

  const { error } = await sb.from("customers").update(patch).eq("id", id);
  if (fail(error)) return;
  const c = cust(id); toast(`ย้าย ${c?.name || ""} ไป "${st(stage).n}"`);
  await sb.from("activities").insert({ customer_id: id, body: `เปลี่ยนสถานะเป็น "${st(stage).n}"${lost_reason ? " เหตุผล: " + lost_reason : ""}` });

function shrinkImage(file, max = 1600) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); cv.toBlob(b => b ? ok(b) : bad(new Error("แปลงรูปไม่ได้")), "image/jpeg", .82); };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("เปิดไฟล์รูปนี้ไม่ได้")); };
    img.src = url;
  });
}
function getPos() {
  return new Promise(ok => { if (!navigator.geolocation) return ok(null); navigator.geolocation.getCurrentPosition(p => ok({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6) }), () => ok(null), { enableHighAccuracy: true, timeout: 12000 }); });
}

/* ===== quotations ===== */
const money2 = n => Number(n || 0).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function quoteCalc(items, discount, vatRate) {
  const subtotal = items.reduce((a, it) => a + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const after = Math.max(0, subtotal - (Number(discount) || 0));
  const vat = Math.round(after * (Number(vatRate) || 0)) / 100;
  return { subtotal, after, vat, total: after + vat };
}

  $("#q_add").onclick = () => { items.push({ name: "", unit: "ชิ้น", qty: 1, price: 0 }); draw(); $$("#q_items [data-k=name]").pop().focus(); };

  const save = async () => {
    const clean = items.filter(it => it.name.trim()).map(it => ({ name: it.name.trim(), unit: it.unit || "", qty: Number(it.qty) || 0, price: Number(it.price) || 0 }));
    if (!clean.length) { $("#q_err").textContent = "เพิ่มอย่างน้อย 1 รายการ"; return null; }

    return res.data;
  };

function bahtText(n) {
  // อ่านจำนวนเงินเป็นตัวหนังสือภาษาไทย
  const d = ["", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"], u = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน"];
  const read = s => { let out = ""; s = s.replace(/^0+/, ""); if (!s) return ""; if (s.length > 6) return read(s.slice(0, -6)) + "ล้าน" + read(s.slice(-6)); const L = s.length; [...s].forEach((ch, i) => { const v = +ch, pos = L - i - 1; if (!v) return; if (pos === 0 && v === 1 && L > 1) out += "เอ็ด"; else if (pos === 1 && v === 2) out += "ยี่"; else if (pos === 1 && v === 1) out += ""; else out += d[v]; out += u[pos]; }); return out; };
  const [b, s] = Number(n).toFixed(2).split(".");
  const bt = read(b) || "ศูนย์";
  return bt + "บาท" + (+s ? read(s) + "สตางค์" : "ถ้วน");
}

const FIELDS = [
  ["name", "ชื่อร้าน / บริษัท *", /ชื่อร้าน|บริษัท|ลูกค้า|customer|company|name/i],

  ["lat", "ละติจูด หรือ พิกัด \"lat, lng\"", /lat|ละติจูด|พิกัด|location|โลเคชั่น/i],
  ["lng", "ลองจิจูด", /lng|lon|ลองจิจูด/i],
  ["stage", "สถานะ", /สถานะ|status|stage/i],
  ["deal_value", "มูลค่า / ยอดขาย", /มูลค่า|ยอด|ราคา|value|amount|price/i],
  ["source", "ที่มา", /ที่มา|source|ช่องทาง/i],
  ["owner", "เซลล์ผู้ดูแล (ชื่อ)", /เซล|ผู้ดูแล|owner|sales|rep/i],
];
function toStage(v) {
  const s = v.trim().toLowerCase(), hit = STAGES.find(x => x.k === s || x.n === v.trim());
  if (hit) return hit.k;
  if (/ปิด|won|สำเร็จแล้ว|ซื้อแล้ว/.test(s)) return "won";
  if (/ไม่|lost|ยกเลิก/.test(s)) return "lost";
  if (/ต่อรอง|nego/.test(s)) return "nego";
  if (/เสนอ|quote/.test(s)) return "quote";
  if (/ติดต่อ|contact|คุย/.test(s)) return "contact";
  return "lead";
}
function importer(box) {
  let headers = [], data = [], map = {};
  box.innerHTML = `<div class="form"><p class="sub" style="margin:0">ใน Google Sheet ไปที่ ไฟล์ → ดาวน์โหลด → CSV แล้วเลือกไฟล์ที่นี่ หรือคัดลอกทั้งตาราง (รวมหัวคอลัมน์) มาวางในช่องด้านล่าง</p>
    <input type="file" id="csv-file" accept=".csv,text/csv"><textarea id="csv-paste" rows="3" placeholder="หรือวางข้อมูลจาก Google Sheet ที่นี่"></textarea><div class="sub" id="imsg"></div><div id="imap"></div></div>`;
  const load = text => {
    const res = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
    headers = res.meta.fields || []; data = res.data; map = {};
    const used = new Set();
    for (const [k, , re] of FIELDS) { const h = headers.find(h => !used.has(h) && re.test(h)); if (h) { map[k] = h; used.add(h); } }
    $("#imsg").textContent = `อ่านได้ ${data.length} แถว ตรวจการจับคู่คอลัมน์ด้านล่างแล้วกดนำเข้า`;
    draw();
  };
  const rows = () => {
    const get = (r, k) => map[k] ? String(r[map[k]] ?? "").trim() : "";
    return data.map(r => {
      let lat = null, lng = null; const lr = get(r, "lat"), pair = lr.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
      if (pair) { lat = +pair[1]; lng = +pair[2]; } else { if (lr) lat = Number(lr) || null; if (get(r, "lng")) lng = Number(get(r, "lng")) || null; }
      if (lat == null || lng == null) { lat = null; lng = null; }
      const on = get(r, "owner"), owner = on ? S.team.find(p => p.full_name && (p.full_name.includes(on) || on.includes(p.full_name))) : null;
      const v = Number(get(r, "deal_value").replace(/[^\d.]/g, ""));
      return { name: get(r, "name"), contact_name: get(r, "contact_name") || null, phone: get(r, "phone") || null, line_id: get(r, "line_id") || null, email: get(r, "email") || null, address: get(r, "address") || null, lat, lng, stage: get(r, "stage") ? toStage(get(r, "stage")) : "lead", deal_value: Number.isFinite(v) ? v : 0, source: get(r, "source") || null, owner_id: owner?.id || S.me.id };
    }).filter(r => r.name);
  };
  const draw = () => {
    if (!headers.length) { $("#imap").innerHTML = ""; return; }
    const rs = rows();
    $("#imap").innerHTML = `<div class="row2">${FIELDS.map(([k, l]) => `<label>${l}<select data-map="${k}"><option value="">ไม่นำเข้า</option>${headers.map(h => `<option ${map[k] === h ? "selected" : ""}>${esc(h)}</option>`).join("")}</select></label>`).join("")}</div>
    <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>ชื่อ</th><th>ผู้ติดต่อ</th><th>เบอร์</th><th>สถานะ</th><th class="num">มูลค่า</th><th>พิกัด</th><th>ผู้ดูแล</th></tr></thead><tbody>
    ${rs.slice(0, 5).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.contact_name)}</td><td>${esc(r.phone)}</td><td>${st(r.stage).n}</td><td class="num">${baht(r.deal_value)}</td><td>${r.lat != null ? r.lat.toFixed(4) + ", " + r.lng.toFixed(4) : "-"}</td><td>${esc(person(r.owner_id)?.full_name)}</td></tr>`).join("")}</tbody></table></div>
    <div style="margin-top:10px"><button class="btn pri" id="impBtn" ${map.name ? "" : "disabled"}>นำเข้า ${rs.length} ราย</button></div>`;
    $$("[data-map]").forEach(s => s.onchange = () => { map[s.dataset.map] = s.value; draw(); });
    $("#impBtn").onclick = async () => {
      const all = rows(); $("#impBtn").disabled = true; let done = 0;
      for (let i = 0; i < all.length; i += 200) {
        $("#impBtn").textContent = `กำลังนำเข้า ${done}/${all.length}…`;
        const { error } = await sb.from("customers").insert(all.slice(i, i + 200));
        if (error) { $("#imsg").textContent = `นำเข้าได้ ${done} ราย แล้วเกิดข้อผิดพลาด: ${error.message}`; await refresh(); return; }
        done += Math.min(200, all.length - i);
      }
      toast(`นำเข้าสำเร็จ ${done} ราย`); await refresh();
    };
  };
  $("#csv-file").onchange = async e => { const f = e.target.files?.[0]; if (f) load(await f.text()); };
  $("#csv-paste").onpaste = e => { const t = e.clipboardData.getData("text"); if (t) { e.preventDefault(); load(t.includes("\t") ? Papa.unparse(Papa.parse(t.trim(), { delimiter: "\t" }).data) : t); } };
}

/* ===== boot ===== */
async function onSession(session) {
  if (!session) { S.user = S.me = null; if (leafMap) { leafMap.remove(); leafMap = null; } closeLayer(); if (!S.org) await loadOrg(); loginView(); return; }
  if (S.user?.id === session.user.id && S.me) return;
  S.user = session.user;
  $("#root").innerHTML = `<div class="loading">กำลังโหลดข้อมูล…</div>`;
  await loadAll();
  if (S.me.status !== "active") return pendingView();
  shell(); route();
}
async function boot() {
  if (typeof supabase === "undefined" && !DEMO) { $("#root").innerHTML = `<div class="loading" style="padding:16px;text-align:center">เชื่อมต่ออินเทอร์เน็ตไม่ได้ ตรวจสัญญาณแล้วลองใหม่<br><button class="btn" style="margin-top:12px" onclick="location.reload()">ลองใหม่</button></div>`; return; }
  if (/type=recovery/.test(location.hash)) {
    sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") resetPasswordView(); });
    return;
  }
  sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT" || ev === "INITIAL_SESSION") setTimeout(() => onSession(session), 0); });
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
</script>
